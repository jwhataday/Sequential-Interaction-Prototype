<style>
/* Layout: one letterboxed stage frame centered on a quiet page; signifiers float inside the frame, bottom center. */
:root {
  --page: #e6e6e4;
  --ink: #2b2b2b;
  --muted: #6e6e6c;
  --frame-edge: #c9c9c6;
  --pill: rgba(255,255,255,0.82);
  --pill-edge: rgba(43,43,43,0.18);
  --yellow: #f6c90e;
  --yellow-deep: #d9a900;
  --font-ui: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #141414; --ink: #e8e8e6; --muted: #9a9a98; --frame-edge: #2c2c2c;
    --pill: rgba(20,20,20,0.72); --pill-edge: rgba(255,255,255,0.16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #141414; --ink: #e8e8e6; --muted: #9a9a98; --frame-edge: #2c2c2c;
  --pill: rgba(20,20,20,0.72); --pill-edge: rgba(255,255,255,0.16); color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
.top { width: min(100%, calc((100vh - 104px) * 1.6)); display: flex; justify-content: flex-end; }
.reset {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--pill-edge); background: var(--pill); color: var(--ink); cursor: pointer;
}
.reset:hover { background: var(--page); }
.reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.reset svg { width: 16px; height: 16px; }
.frame {
  position: relative; width: min(100%, calc((100vh - 104px) * 1.6));
  aspect-ratio: 8 / 5; max-width: 100%;
  overflow: hidden; border-radius: 6px; outline: 1px solid var(--frame-edge);
  background: #f2f2f2; cursor: default; contain: paint;
}
/* Vanishing point sits on the stage floor: 440,300 in the 800×500 scene */
.layer {
  position: absolute; inset: 0; width: 100%; height: 100%;
  will-change: transform, filter; overflow: visible;
}
.overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
/* Signifiers */
.hint {
  position: absolute; left: 50%; bottom: 6%;
  transform: translate(-50%, 12px); opacity: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px 10px 12px; border-radius: 999px;
  background: var(--pill); border: 1px solid var(--pill-edge);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: opacity 420ms ease, transform 520ms cubic-bezier(.2,1.4,.4,1);
  pointer-events: none;
}
.hint.in { opacity: 1; transform: translate(-50%, 0); }
.hint.out { opacity: 0; transform: translate(-50%, 8px) scale(0.92); transition-duration: 260ms; }
.hand { width: 30px; height: 30px; color: var(--ink); animation: tap 1.3s ease-in-out infinite; transform-origin: 40% 90%; }
@keyframes tap {
  0%, 55%, 100% { transform: translateY(0) rotate(0); }
  65% { transform: translateY(3px) rotate(-6deg); }
  75% { transform: translateY(0) rotate(0); }
  82% { transform: translateY(3px) rotate(-6deg); }
  92% { transform: translateY(0) rotate(0); }
}
.dots { display: flex; gap: 8px; }
.dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--ink); box-sizing: border-box; background: transparent;
  transition: background 120ms ease, border-color 120ms ease;
}
.dot.on { background: var(--yellow); border-color: var(--yellow-deep); animation: pop 420ms cubic-bezier(.2,1.8,.4,1); }
@keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
.ripple {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  border: 2px solid var(--yellow); pointer-events: none;
  animation: ripple 520ms ease-out forwards;
}
@keyframes ripple { to { transform: scale(4.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hand { animation: none; } }
</style>

<script>
(() => {
  const frame = document.getElementById('frame');
  const hint = document.getElementById('hint');
  const dotsWrap = document.getElementById('dots');
  const dots = [...dotsWrap.children];
  const layers = [...frame.querySelectorAll('.layer')].map(el => ({
    el, r: parseFloat(el.dataset.r), e: parseFloat(el.dataset.e), blur: !!el.dataset.blur, prev: null
  }));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The camera starts far out and travels TRAVEL units; it ends NEAR units past the old
  // reference point, standing directly behind the front row of the crowd.
  const TRAVEL = 8.6, NEAR = 0.4;
  // Eye level: each layer has a line (data-e) at a standing person's eye height. That line is
  // pinned to one horizon on screen, so every head in the crowd sits on the viewer's eye line.
  const HORIZON = 270;            // screen y, in 800×500 viewBox units
  for (const L of layers) L.el.style.transformOrigin = `55% ${L.e / 5}%`;
  let count = 0, phase = 'idle', introTimer;

  // ---------- Music: a synthesized kick, bass and hats, heard through a low-pass "distance" filter ----------
  const music = (() => {
    const BEAT = 60 / 124;
    let ac = null, lp, master;
    function start() {
      if (ac) { ac.resume?.(); return; }
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
      lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200; lp.Q.value = 0.7;
      master = ac.createGain(); master.gain.value = 0;
      lp.connect(master); master.connect(ac.destination);
      const noise = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const notes = [41.2, 41.2, 49, 36.7];
      let next = ac.currentTime + 0.05, n = 0;
      const kick = t => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
        g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + 0.4);
      };
      const hat = t => {
        const s = ac.createBufferSource(); s.buffer = noise;
        const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
        const g = ac.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        s.connect(f); f.connect(g); g.connect(lp); s.start(t); s.stop(t + 0.06);
      };
      const bass = (t, hz) => {
        const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.value = hz * 2; f.type = 'lowpass'; f.frequency.value = 520;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.9);
        o.connect(f); f.connect(g); g.connect(lp); o.start(t); o.stop(t + BEAT);
      };
      setInterval(() => {
        while (next < ac.currentTime + 0.25) {
          kick(next); hat(next + BEAT / 2); bass(next + BEAT / 2, notes[Math.floor(n / 4) % 4]);
          next += BEAT; n++;
        }
      }, 60);
    }
    // gain 0..1, cutoff in Hz (low = far away and muffled), tc = smoothing time
    function set(gain, cutoff, tc = 0.15) {
      if (!ac) return;
      master.gain.setTargetAtTime(gain, ac.currentTime, tc);
      lp.frequency.setTargetAtTime(cutoff, ac.currentTime, tc);
    }
    // 1 on each kick, decaying to 0 before the next
    function beat() {
      const t = ac ? ac.currentTime - 0.05 : performance.now() / 1000;
      return Math.exp(-((((t % BEAT) + BEAT) % BEAT) / BEAT) * 7);
    }
    return { start, set, beat, BEAT };
  })();



  // True perspective: apparent size = r / (distance still between camera and layer).
  function setCamera(c, moving = false) {
    const left = TRAVEL - c - NEAR;
    drawPath(left);
    for (const L of layers) {
      const s = L.r / (L.r + left);
      L.el.style.transform = `translateY(${((HORIZON - L.e) / 5).toFixed(3)}%) scale(${s})`;
      let b = 0;
      if (moving && L.prev) b = Math.min(6, (Math.abs(s - L.prev) / s) * 60 * (L.blur ? 1.6 : 0.6));
      // at rest, the heads right in front of the lens sit slightly out of focus
      if (!moving && L.blur && s > 2.2) b = Math.max(b, 1.2);
      L.el.style.filter = b > 0.2 ? `blur(${b.toFixed(2)}px)` : '';
      L.prev = moving ? s : null;
    }
  }

  // Ground path. A ground point at depth z (front row of the crowd = r 1) lands at
  // y = HORIZON + EYE / z and x = CX + X / z. EYE matches the crowd's eye-to-feet drop.
  const EYE = 74, CX = 440, PATH_W = 46, PATH_END = 2.0;
  const NS = 'http://www.w3.org/2000/svg';
  const pathBody = document.getElementById('pathBody');
  const edgeL = document.getElementById('pathEdgeL'), edgeR = document.getElementById('pathEdgeR');
  const marksG = document.getElementById('pathMarks'), postsG = document.getElementById('posts');
  // pebbles/ruts on the path and posts along its edges, at fixed world depths
  const marks = [], posts = [];
  for (let d = -9; d < PATH_END; d += 0.23) {
    const el = document.createElementNS(NS, 'ellipse'); marksG.appendChild(el);
    marks.push({ el, d, x: ((d * 37.3) % 1 + 1) % 1 * 1.4 - 0.7 });
  }
  for (let d = -9; d <= 0.85; d += 0.45) for (const side of [-1, 1]) {
    const el = document.createElementNS(NS, 'line');
    el.setAttribute('stroke', '#3e3e3e'); el.setAttribute('stroke-linecap', 'round');
    postsG.appendChild(el); posts.push({ el, d, side });
  }
  const P = z => [HORIZON + EYE / z];
  function drawPath(left) {
    const zNear = 0.22, zFar = PATH_END + left;
    if (zFar <= zNear) { pathBody.setAttribute('points', ''); return; }
    const pts = [], L = [], R = [];
    const N = 24;
    for (let i = 0; i <= N; i++) {
      const z = zNear * Math.pow(zFar / zNear, i / N);
      const y = HORIZON + EYE / z;
      L.push(`${(CX - PATH_W / z).toFixed(1)},${y.toFixed(1)}`);
      R.push(`${(CX + PATH_W / z).toFixed(1)},${y.toFixed(1)}`);
    }
    pathBody.setAttribute('points', L.concat(R.slice().reverse()).join(' '));
    edgeL.setAttribute('points', L.join(' ')); edgeR.setAttribute('points', R.join(' '));
    const sw = Math.min(6, 2.2 / zNear * 0.25);
    edgeL.setAttribute('stroke-width', sw); edgeR.setAttribute('stroke-width', sw);
    for (const m of marks) {
      const z = m.d + left;
      if (z < 0.2 || z > zFar) { m.el.setAttribute('rx', 0); continue; }
      m.el.setAttribute('cx', (CX + m.x * PATH_W / z).toFixed(1));
      m.el.setAttribute('cy', (HORIZON + EYE / z).toFixed(1));
      m.el.setAttribute('rx', (5 / z).toFixed(2)); m.el.setAttribute('ry', (1.6 / z).toFixed(2));
    }
    for (const q of posts) {
      const z = q.d + left;
      if (z < 0.12) { q.el.setAttribute('stroke-width', 0); continue; }
      const x = CX + q.side * (PATH_W + 14) / z;
      q.el.setAttribute('x1', x.toFixed(1)); q.el.setAttribute('x2', x.toFixed(1));
      q.el.setAttribute('y1', (HORIZON + EYE / z).toFixed(1));
      q.el.setAttribute('y2', (HORIZON + (EYE - 26) / z).toFixed(1));
      q.el.setAttribute('stroke-width', Math.min(40, 3.2 / z).toFixed(2));
      q.el.setAttribute('opacity', Math.min(1, (z - 0.12) / 0.15).toFixed(2));
    }
  }

  function intro() {
    count = 0; phase = 'armed';
    dots.forEach(d => d.classList.remove('on'));
    hint.classList.remove('out');
    clearTimeout(introTimer);
    introTimer = setTimeout(() => hint.classList.add('in'), 700);
  }

  function ripple(x, y) {
    const r = frame.getBoundingClientRect();
    const px = Math.min(Math.max(x - r.left, 0), r.width);
    const py = Math.min(Math.max(y - r.top, 0), r.height);
    const el = document.createElement('span');
    el.className = 'ripple'; el.style.left = px + 'px'; el.style.top = py + 'px';
    frame.appendChild(el); setTimeout(() => el.remove(), 560);
  }

  function register(x, y) {
    if (phase !== 'armed') return;
    hint.classList.add('in'); clearTimeout(introTimer);
    dots[count].classList.add('on');
    count++;
    ripple(x, y);
    if (count === 2) { phase = 'pushing'; setTimeout(push, 260); }
  }

  // A tiny crouch back, then an instant burst that settles like a dolly braking.
  const DUR = 1700, CROUCH = 0.08;
  const ease = x => 1 - Math.pow(1 - x, 4);
  const curve = p => p < CROUCH ? -0.25 * Math.sin((p / CROUCH) * Math.PI)
                                : ease((p - CROUCH) / (1 - CROUCH));

  function push() {
    hint.classList.add('out');
    if (reduce) { setCamera(TRAVEL); done(); return; }
    let start = null;
    function step(now) {
      if (start === null) start = now;
      const p = Math.min(1, (now - start) / DUR);
      setCamera(TRAVEL * curve(p), p < 1);
      if (p > 0.55) music.set(0.42, 260, 0.35);
      if (p < 1) requestAnimationFrame(step); else { setCamera(TRAVEL); done(); }
    }
    requestAnimationFrame(step);
  }

  function done() {
    phase = 'done';
    music.set(0.42, 260, 0.35);
  }

  function reset() {
    if (phase === 'pushing' || phase === 'resetting') return;
    music.set(0, 260, 0.25);
    hint.classList.remove('in');
    if (reduce) { setCamera(0); intro(); return; }
    let start = null; phase = 'resetting';
    function back(now) {
      if (start === null) start = now;
      const p = Math.min(1, (now - start) / 900);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      setCamera(TRAVEL * (1 - e));
      if (p < 1) requestAnimationFrame(back); else { setCamera(0); intro(); }
    }
    requestAnimationFrame(back);
  }

  // Any click counts: left, right, middle, or a tap.
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('.reset')) return;
    music.start();
    register(e.clientX, e.clientY);
  });
  document.getElementById('reset').addEventListener('click', reset);

  setCamera(0);
  intro();
})();
</script>

</body></html>
