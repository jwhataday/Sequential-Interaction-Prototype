<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Push Forward</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one letterboxed scene frame centered on a quiet page; a reset icon sits above its top-right corner. */
:root {
  --page: #e6e6e4;
  --ink: #2b2b2b;
  --frame-edge: #c9c9c6;
  --pill: rgba(255,255,255,0.84);
  --pill-edge: rgba(43,43,43,0.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #141414; --ink: #e8e8e6; --frame-edge: #2c2c2c;
    --pill: rgba(20,20,20,0.74); --pill-edge: rgba(255,255,255,0.16); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #141414; --ink: #e8e8e6; --frame-edge: #2c2c2c;
  --pill: rgba(20,20,20,0.74); --pill-edge: rgba(255,255,255,0.16); color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
.top { width: min(100%, calc((100vh - 104px) * 1.6)); display: flex; justify-content: flex-end; }
.reset {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--pill-edge); background: var(--pill); color: var(--ink); cursor: pointer;
}
.reset:hover { background: var(--page); }
.reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.reset svg { width: 16px; height: 16px; }
.frame {
  position: relative; width: min(100%, calc((100vh - 104px) * 1.6));
  aspect-ratio: 8 / 5; max-width: 100%;
  overflow: hidden; border-radius: 6px; outline: 1px solid var(--frame-edge);
  background: #e4e4e4; cursor: grab; touch-action: none; contain: paint;
}
.frame.holding { cursor: grabbing; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene g { transform-box: view-box; }

/* Signifier: a hand swiping forward over the gap */
.hint {
  position: absolute; left: 50%; top: 50%; width: 64px; height: 170px;
  transform: translate(-50%, -22%); opacity: 0;
  transition: opacity 420ms ease; pointer-events: none;
}
.hint.in { opacity: 1; }
.hint .trail {
  position: absolute; left: 50%; top: 6px; width: 4px; height: 124px; margin-left: -2px; border-radius: 2px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.95));
  transform-origin: 50% 100%; animation: trail 1.5s ease-in-out infinite;
}
.hint .hand {
  position: absolute; left: 50%; bottom: 0; width: 38px; height: 38px; margin-left: -15px;
  color: #2b2b2b; animation: swipeUp 1.5s ease-in-out infinite;
  filter: drop-shadow(0 1px 0 rgba(255,255,255,0.7));
}
@keyframes swipeUp {
  0% { transform: translateY(0); opacity: 0; }
  12% { transform: translateY(0); opacity: 1; }
  22% { transform: translateY(4px) scale(0.92); }
  70% { transform: translateY(-114px) scale(0.92); opacity: 1; }
  88%, 100% { transform: translateY(-120px) scale(1); opacity: 0; }
}
@keyframes trail {
  0%, 22% { transform: scaleY(0); opacity: 0; }
  70% { transform: scaleY(1); opacity: 1; }
  100% { transform: scaleY(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .hint .hand, .hint .trail { animation-duration: 3s; } }
</style>

<script>
(() => {
  const frame = document.getElementById('frame');
  const hint = document.getElementById('hint');
  const world = document.getElementById('world');
  const handL = document.getElementById('handL'), handR = document.getElementById('handR');
  const smile = document.getElementById('smile'), thumb = document.getElementById('thumb');
  const armUp = document.getElementById('armUp'), pBody = document.getElementById('pBody');
  const cones = [...document.querySelectorAll('.cone')];
  const beams = document.getElementById('beams');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const layers = [...document.querySelectorAll('.layer')].map((el, i) => ({
    el, r: +el.dataset.r, k: +el.dataset.k, crowd: el.classList.contains('crowd'), phase: i * 1.7
  }));

  // Camera path: START units behind the reference view, END units past it (at the barrier).
  const START = 2.2, END = 1.36, VX = 400, VY = 300;
  const BPM = 124, BEAT = 60 / BPM;

  let st;
  function fresh() {
    return { phase: 'fight', p: 0, v: 0, holding: false, lastY: 0, idle: 0, started: false,
             pressure: 0.3, shoveIn: 1.2, reach: { s: 0, v: 0 }, knock: 0,
             jolt: { x: 0, vx: 0, r: 0, vr: 0 }, doneT: 0 };
  }

  // ---------- Sound: a simple synthesized track that gets closer and louder ----------
  let ac = null, master, lp;
  function startAudio() {
    if (ac) { ac.resume?.(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { ac = null; return; }
    lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 0.7;
    master = ac.createGain(); master.gain.value = 0.12;
    lp.connect(master); master.connect(ac.destination);
    const noise = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const bassNotes = [41.2, 41.2, 49, 36.7];      // E1 E1 G1 D1
    let next = ac.currentTime + 0.05, step = 0;
    const kick = t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
      g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + 0.4);
    };
    const hat = t => {
      const s = ac.createBufferSource(); s.buffer = noise;
      const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
      const g = ac.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      s.connect(f); f.connect(g); g.connect(lp); s.start(t); s.stop(t + 0.06);
    };
    const bass = (t, hz) => {
      const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = hz * 2;
      f.type = 'lowpass'; f.frequency.value = 520;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.9);
      o.connect(f); f.connect(g); g.connect(lp); o.start(t); o.stop(t + BEAT);
    };
    setInterval(() => {
      while (next < ac.currentTime + 0.25) {
        kick(next);
        hat(next + BEAT / 2);
        bass(next + BEAT / 2, bassNotes[Math.floor(step / 4) % 4]);
        next += BEAT; step++;
      }
    }, 60);
  }
  function setLoudness(p) {
    if (!ac) return;
    const t = ac.currentTime;
    lp.frequency.setTargetAtTime(380 + Math.pow(p, 1.4) * 7000, t, 0.08);
    master.gain.setTargetAtTime(0.12 + p * 0.38, t, 0.08);
  }
  const clock = () => ac ? ac.currentTime - 0.05 : performance.now() / 1000;

  // ---------- Input: press and drag forward (up), stroke after stroke ----------
  const toView = d => d / frame.getBoundingClientRect().height * 500;
  const GAIN = 0.0014;          // forward speed gained per viewBox unit of upward drag
  frame.addEventListener('pointerdown', e => {
    startAudio();
    if (st.phase !== 'fight') return;
    st.holding = true; st.lastY = e.clientY;
    frame.classList.add('holding'); frame.setPointerCapture?.(e.pointerId);
  });
  frame.addEventListener('pointermove', e => {
    if (!st.holding || st.phase !== 'fight') return;
    const dy = toView(st.lastY - e.clientY); st.lastY = e.clientY;
    if (dy <= 0) return;                         // pulling back down just resets your hands
    st.started = true; st.idle = 0; hint.classList.remove('in');
    st.v += dy * GAIN;
    st.reach.v += dy * 0.09;
    st.pressure = Math.max(0, st.pressure - dy * 0.0025);   // you pry the gap open
  });
  const release = () => {
    if (!st.holding) return;
    st.holding = false; frame.classList.remove('holding');
  };
  frame.addEventListener('pointerup', release);
  frame.addEventListener('pointercancel', release);
  frame.addEventListener('contextmenu', e => e.preventDefault());

  // the crowd shoves back: a knock that costs you ground and rocks the camera
  function shove() {
    const hard = 0.06 + Math.random() * 0.07 + st.p * 0.05;
    st.v -= hard;
    const dir = Math.random() < 0.5 ? -1 : 1;
    st.jolt.vx += dir * (90 + Math.random() * 80);
    st.jolt.vr += -dir * (14 + Math.random() * 10);
    st.pressure = Math.min(1, st.pressure + 0.45);
    st.knock = 1;
  }

  // ---------- Loop ----------
  let last = performance.now();
  function step(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    const t = clock();
    const beat = Math.exp(-((t % BEAT) / BEAT) * 7);         // 1 on the kick, decaying

    if (st.phase === 'fight') {
      // slippery: very little friction, a steady push back from the crowd
      if (st.p > 0) st.v -= (0.075 + 0.03 * st.p) * dt;
      st.v *= Math.exp(-0.85 * dt);
      st.v = Math.max(st.v, -0.22);            // you slide back, but never faster than this
      st.p += st.v * dt;
      if (st.p < 0) { st.p = 0; st.v = Math.max(0, st.v) * 0.3; }
      if (st.started) {
        st.shoveIn -= dt;
        if (st.shoveIn <= 0 && st.p > 0.03) { shove(); st.shoveIn = 0.55 + Math.random() * 0.9; }
      }
      st.pressure += (0.3 - st.pressure) * 0.6 * dt;
      if (!st.holding) st.idle += dt;
      if (st.idle > 2.2 && st.p < 0.6) hint.classList.add('in');
      if (st.p >= 0.985) { st.phase = 'arrived'; st.doneT = 0; st.v = Math.min(st.v, 0.4); hint.classList.remove('in'); }
    } else if (st.phase === 'arrived') {
      st.doneT += dt;
      // slide the last bit and settle against the barrier
      st.v += ((1 - st.p) * 60 - st.v * 6) * dt;
      st.p += st.v * dt;
      st.pressure += (0 - st.pressure) * 2 * dt;
    }
    const pc = Math.max(0, Math.min(1, st.p));
    frame.dataset.p = pc.toFixed(2);
    setLoudness(pc);

    // camera jolts spring back to centre
    const J = st.jolt;
    J.vx += (-J.x * 70 - J.vx * 7) * dt; J.x += J.vx * dt;
    J.vr += (-J.r * 70 - J.vr * 7) * dt; J.r += J.vr * dt;
    st.knock *= Math.exp(-5 * dt);
    const jostle = reduce || st.phase !== 'fight' ? 0 : st.pressure * 1.6;
    const roll = reduce ? 0 : J.r + Math.sin(t * 7.3) * jostle * 0.5;
    const slip = reduce ? 0 : J.x + Math.sin(t * 5.1) * jostle * 4;
    const pulse = reduce ? 0 : beat * 0.006 * (0.3 + pc);
    const left = START - pc * (START + END);
    world.setAttribute('transform', `translate(${(VX + slip).toFixed(2)} ${VY}) rotate(${roll.toFixed(2)}) scale(${(1 + pulse).toFixed(4)}) translate(${-VX} ${-VY})`);

    for (const L of layers) {
      const dist = L.r + left;
      if (dist <= 0.17) { L.el.setAttribute('opacity', 0); continue; }
      const s = L.k / dist;
      L.el.setAttribute('opacity', dist < 0.4 ? ((dist - 0.17) / 0.23).toFixed(3) : 1);
      let sway = 0, bob = 0, squeeze = 1;
      if (L.crowd && !reduce) {
        sway = Math.sin(t * Math.PI / BEAT + L.phase) * 0.9;
        bob = beat * 3 * Math.min(1, s);
        // the nearest rows crowd in on the gap when they push back
        if (dist < 1.8) squeeze = 1 - st.pressure * 0.13 * (1.8 - dist) / 1.8 * 2;
      }
      L.el.setAttribute('transform',
        `translate(${VX} ${VY + bob}) scale(${(s * squeeze).toFixed(4)} ${s.toFixed(4)}) rotate(${sway.toFixed(2)}) translate(${-VX} ${-VY})`);
    }

    // speakers thump, lights breathe
    const boom = beat * (0.25 + st.p);
    for (const c of cones) c.setAttribute('r', (+c.dataset.r0 * (1 + boom * 0.18)).toFixed(2));
    beams.setAttribute('opacity', (0.75 + beat * 0.25).toFixed(3));

    // your hands claw forward on each stroke, and get knocked back on each shove
    const R = st.reach;
    R.v += (-R.s * 55 - R.v * 6) * dt; R.s += R.v * dt;
    const reach = Math.max(-0.4, Math.min(1.4, R.s));
    let hx = 0, hy = 0, hr = 0;
    if (!reduce) {
      hx = Math.max(0, reach) * 60 - st.knock * 16;
      hy = -reach * 70 + st.knock * 40;
      hr = Math.max(0, reach) * 12;
    }
    handL.setAttribute('transform', `translate(${-hx} ${hy}) rotate(${-hr} 235 500)`);
    handR.setAttribute('transform', `translate(${hx} ${hy}) rotate(${hr} 565 500)`);

    // the performer notices you
    if (st.phase === 'arrived') {
      const k = Math.min(1, Math.max(0, (st.doneT - 0.25) / 0.25));
      smile.setAttribute('opacity', k.toFixed(2));
      const th = Math.min(1, Math.max(0, (st.doneT - 0.45) / 0.18));
      thumb.setAttribute('opacity', th.toFixed(2)); armUp.setAttribute('opacity', (1 - th).toFixed(2));
      const pop = th > 0 && th < 1 ? Math.sin(th * Math.PI) * 4 : 0;
      pBody.setAttribute('transform', `translate(0 ${(-pop - beat * 2).toFixed(2)})`);
    } else {
      pBody.setAttribute('transform', `translate(0 ${(-beat * 1.5).toFixed(2)})`);
    }

    requestAnimationFrame(step);
  }

  let hintTimer;
  function reset() {
    st = fresh();
    smile.setAttribute('opacity', 0); thumb.setAttribute('opacity', 0); armUp.setAttribute('opacity', 1);
    hint.classList.remove('in'); clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { if (st.phase === 'fight' && !st.started) hint.classList.add('in'); }, 700);
  }
  document.getElementById('reset').addEventListener('click', reset);

  reset();
  requestAnimationFrame(step);
})();
</script>

</body></html>
